<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var primary = 'vibe-flows.vercel.app'
        var aliases = {
          'vibeflowe.vercel.app': 1,
          'vibeflows-app.vercel.app': 1,
          'vibeflowapp.vercel.app': 1,
          'vibeflowsapp.vercel.app': 1,
          'vibeflowsweb.vercel.app': 1,
        }
        if (aliases[location.hostname]) {
          location.replace(
            'https://' +
              primary +
              location.pathname +
              location.search +
              location.hash,
          )
        }
      })()
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=6" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=6" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=6" />
    <link rel="shortcut icon" href="/favicon.png?v=6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="VibeFlows — discover obscure music genres, swipe ~6000 labels from Every Noise at Once" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>VibeFlows</title>
    <meta name="apple-mobile-web-app-title" content="VibeFlows" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>
